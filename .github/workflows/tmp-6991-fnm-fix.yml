name: Temporary verify fnm Windows discovery

on:
  push:
    branches:
      - fix/fnm-windows-discovery-6991

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fnm-windows-discovery-6991
          fetch-depth: 0

      - name: Apply focused #6991 patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src-tauri/src/commands/misc.rs")
          text = path.read_text(encoding="utf-8")

          def replace_once(source: str, target: str, replacement: str) -> str:
              count = source.count(target)
              if count != 1:
                  raise SystemExit(f"expected exactly one patch anchor, found {count}: {target[:120]!r}")
              return source.replace(target, replacement, 1)

          text = replace_once(
              text,
              '''    push_env_child_dir(paths, std::env::var_os("VOLTA_HOME"), "bin");
              push_env_single_dir(paths, std::env::var_os("NVM_SYMLINK"));'''.replace("              ", ""),
              '''    push_env_child_dir(paths, std::env::var_os("VOLTA_HOME"), "bin");
              if let Some(fnm_dir) = std::env::var_os("FNM_DIR") {
                  push_unique_path(
                      paths,
                      std::path::PathBuf::from(fnm_dir)
                          .join("aliases")
                          .join("default"),
                  );
              }
              push_env_single_dir(paths, std::env::var_os("NVM_SYMLINK"));'''.replace("              ", ""),
          )

          text = replace_once(
              text,
              '''    if let Some(appdata) = dirs::data_dir() {
              let nvm_home = appdata.join("nvm");'''.replace("              ", ""),
              '''    if let Some(appdata) = dirs::data_dir() {
              push_unique_path(
                  paths,
                  appdata.join("fnm").join("aliases").join("default"),
              );
              let nvm_home = appdata.join("nvm");'''.replace("              ", ""),
          )

          text = replace_once(
              text,
              '''    } else if s.contains("fnm_multishells") {
              "fnm"'''.replace("              ", ""),
              '''    } else if s.contains("fnm_multishells") || s.contains("/fnm/aliases/") {
              "fnm"'''.replace("              ", ""),
          )

          text = replace_once(
              text,
              '''        #[test]
              fn windows_nvm_falls_back_to_system() {'''.replace("              ", ""),
              '''        #[test]
              fn windows_fnm_default_alias_is_recognized() {
                  assert_eq!(
                      infer_install_source(Path::new(
                          r"C:\Users\me\AppData\Roaming\fnm\aliases\default\codex.cmd"
                      )),
                      "fnm"
                  );
              }

              #[test]
              fn windows_nvm_falls_back_to_system() {'''.replace("              ", ""),
          )

          text = replace_once(
              text,
              '''    #[cfg(target_os = "windows")]
              #[test]
              fn build_tool_search_paths_includes_standalone_installer_dirs() {'''.replace("              ", ""),
              '''    #[cfg(target_os = "windows")]
              #[test]
              fn build_tool_search_paths_includes_fnm_default_alias() {
                  let appdata = dirs::data_dir().expect("APPDATA should resolve");
                  let codex_paths = build_tool_search_paths("codex");
                  assert!(
                      codex_paths.contains(&appdata.join("fnm").join("aliases").join("default")),
                      "Windows discovery should include fnm's stable default alias"
                  );
              }

              #[cfg(target_os = "windows")]
              #[test]
              fn build_tool_search_paths_includes_standalone_installer_dirs() {'''.replace("              ", ""),
          )

          path.write_text(text, encoding="utf-8")
          '@ | python -

      - name: Format
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Verify focused misc tests
        shell: pwsh
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml commands::misc::tests

      - name: Verify formatting
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Ensure focused diff
        shell: pwsh
        run: |
          $changed = git diff --name-only
          Write-Host $changed
          $unexpected = $changed | Where-Object { $_ -ne 'src-tauri/src/commands/misc.rs' }
          if ($unexpected) {
            throw "Unexpected files changed: $unexpected"
          }

      - name: Commit verified fix and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/commands/misc.rs
          git rm .github/workflows/tmp-6991-fnm-fix.yml
          git commit -m "fix(detect): restore Windows fnm CLI discovery"
          git push origin HEAD:fix/fnm-windows-discovery-6991
